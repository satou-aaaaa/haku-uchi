:root{

.seg>span{min-width:4.5em;text-align:right}

.book{display:flex;flex-direction:column;gap:8px}
.book button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:10px;min-height:60px;border-radius:12px;padding:6px 12px;background:var(--paper);border:2px solid var(--line);font-size:.95rem;line-height:1.4}
.book .mk{font-size:1.4rem;font-weight:900;text-align:center;color:var(--shu2)}
.book small{display:block;color:var(--ink2);font-size:.78rem}
.book .ct{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.wlist{display:flex;flex-wrap:wrap;gap:6px}
.wlist span{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:2px 8px;font-size:.88rem}

.haiku small{color:var(--ink2)}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:1.8rem 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:8px 12px}

.ach .bar{grid-area:br;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--ai)}

.calnav{display:flex;align-items:center;gap:8px}.calnav b{flex:1;text-align:center}.calnav .sub{flex:0 0 72px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;background:var(--paper);border:1px solid var(--line);line-height:1.1}
.cal .c i{font-style:normal;font-size:.6rem;color:var(--gold)}
.cal .c.p{background:#eef2f9;border:2px solid var(--ai)}
.cal .c.late{border:1.5px dashed var(--ai);color:var(--ai2)}
.cal .c.miss{cursor:pointer;border:2px dashed var(--shu);color:var(--shu2);background:#fff}
.cal .c.today{outline:2px solid var(--ink)}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:.75rem;color:var(--ink2)}
.about h3{font-size:1rem;margin:.6rem 0 .2rem}
.about p,.about li{font-size:.92rem;line-height:1.8;text-align:left}
.about ul{padding-left:1.2em;margin:0}
.calib{font-size:1.4rem;font-weight:900;text-align:center;margin:0}
dialog#howto{border:none;border-radius:16px;background:var(--paper);color:var(--ink);max-width:440px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog#howto::backdrop{background:#000000aa}
dialog#howto h2{margin:0 0 10px}
dialog#howto ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog#howto p{margin:0 0 10px;font-size:.9rem;line-height:1.7;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:90%;text-align:center}

    <div class="opts">
      <div class="seg" role="group" aria-label="テンポ"><span>テンポ</span>${TEMPOS.map(([b, l]) => `<button data-bpm="${b}" aria-pressed="${s.opt.bpm === b}">${l}</button>`).join("")}</div>
      <div class="seg" role="group" aria-label="下読み"><span>下読み</span><button data-easy="0" aria-pressed="${!s.opt.easy}">なし</button><button data-easy="1" aria-pressed="${!!s.opt.easy}">あり</button></div>
      <p class="note">下読みありは、拍の区切りが先に見えます（★は2つまで）。</p>
      <button class="sub" id="go-calib">${s.opt.cal ? `ずれを合わせ直す（いま ${Math.round(s.opt.off * 1000)}ミリ秒）` : "はじめに：音と指のずれを合わせる"}</button>
    </div>
    ${footer()}`, {
    "go-d": () => (d ? result("d", k) : startDaily(k, false)),

  app.querySelectorAll("[data-easy]").forEach((b) => (b.onclick = () => { save((s2) => { s2.opt.easy = b.dataset.easy === "1"; }); home(); }));
  if (!s.tut && !$("howto").open) openHow();
}

// ---- ことばを1つ遊ぶ画面 ----
// mode: d 今日・l あとから・h 上級・e とことん・p 練習
function wordScreen({ title, sub, word, reading, mora, dots, lineNo, after, extraTop = "" }) {
  const s = load(), easy = s.opt.easy;
  show(`${hdr(title, sub)}
    ${dots || ""}${extraTop}
    ${lineNo ? `<p class="lineno">${lineNo}</p>` : ""}
    <div class="word"><div class="w">${esc(word)}</div>${reading !== word ? `<div class="r">${esc(reading)}</div>` : ""}</div>
    <p class="count" id="count" aria-hidden="true"></p>
    <div class="slots" id="slots" aria-label="8拍">${slotsHtml(mora.length, mora, easy)}</div>
    <button class="pad" id="pad">はじめる<small>押すと「3・2・1・はい」</small></button>
    <div id="after"></div>`);
  const pad = $("pad");
  let started = false;
  const start = () => {
    if (started) return; started = true;
    ac();
    pad.innerHTML = "タン<small>ここを押す・スペースキーでも</small>";
    say(`${reading}。3、2、1、はいの後に、1拍に1回押します。`);
    playBar(mora).then((res) => {
      if (easy) res.stars = Math.min(res.stars, 2);
      const tipK = H.KINDS.find((x) => x.id !== "plain" && H.kindsOf(reading).includes(x.id)) || H.KINDS[0];
      const sp = mora.map((m) => (m.length > 1 || /[っッんンー]/.test(m) ? `<em>${esc(m)}</em>` : esc(m))).join("・");
      const msg = res.ok ? `打てた！ ${"★".repeat(res.stars) || ""}` : res.extra ? `打ちすぎが${res.extra}回` : `見逃しが${res.g.filter((x) => x === "x").length}拍`;
      $("after").innerHTML = `<div class="verdict${res.ok ? "" : " lose"}"><div class="hd">${res.ok ? "✓" : "✕"} ${esc(msg)}</div>
        <div class="sp" aria-label="${esc(mora.join("、"))}、${mora.length}拍">${sp} ＝ ${mora.length}拍</div>
        <p>${esc(tipK.tip)}</p></div>`;
      say(`${res.ok ? "打てました" : msg}。${reading}は${mora.length}拍。${tipK.tip}`);
      pad.disabled = true; pad.innerHTML = "おわり<small>下のボタンでつぎへ</small>";
      after(res);
    });
  };
  pad.addEventListener("pointerdown", (e) => { e.preventDefault(); if (!started) { LASTIN = performance.now(); start(); return; } onTap(e.timeStamp); }); // 始めた押し方のあとの click を拍に数えない
  pad.addEventListener("click", (e) => { if (!started) return start(); if (performance.now() - LASTIN > 400) onTap(e.timeStamp); }); // キーボード・支援技術の click だけの操作も1回に数える
  pad.focus({ preventScroll: true });
}
const dotsHtml = (n, i) => `<div class="dots" aria-label="${n}語のうち${i + 1}語目">${Array.from({ length: n }, (_, j) => `<i class="${j < i ? "done" : j === i ? "on" : ""}"></i>`).join("")}</div>`;
function nextBtn(label, fn, extra = "") { const a = $("after"); a.insertAdjacentHTML("beforeend", `<button class="main" id="next">${label}</button>${extra}`); $("next").onclick = fn; $("next").focus({ preventScroll: true }); }

// ---- 今日の5語・あとから ----
function startDaily(k, late) {
  const key = late ? "l" : "d";
  save((s) => { const r = s.runs[key]; if (!r || r.date !== k) s.runs[key] = { date: k, ids: H.daily(k), res: [] }; });
  dailyStep(k, late);
}
function dailyStep(k, late) {
  const key = late ? "l" : "d", s = load(), r = s.runs[key];
  if (!r || r.date !== k) return home();
  const i = r.res.length;
  if (i >= r.ids.length) return finishDaily(k, late);
  const w = H.WORDS[r.ids[i]];
  wordScreen({ title: late ? `あとから ${md(k)}` : "今日の5語", sub: `第${dayNo(k)}回`, word: w.w, reading: w.r, mora: w.m, dots: dotsHtml(r.ids.length, i),
    after: (res) => {
      save((s2) => { const r2 = s2.runs[key]; if (r2 && r2.date === k && r2.res.length === i) r2.res.push(res.stars); if (res.ok) keepBest(s2.words, w.id, res.stars); });
      if (i + 1 < r.ids.length) nextBtn("つぎのことば", () => dailyStep(k, late));
      else { const first = commitDaily(k, late); nextBtn("結果を見る", () => result(late ? "l" : "d", k, first)); } // 最後の判定で記録を確定（結果を見ずに閉じても残る）
    } });
}
function finishDaily(k, late) { result(late ? "l" : "d", k, commitDaily(k, late)); }
function commitDaily(k, late) {
  let first = false;
  save((s) => { const key = late ? "l" : "d", r = s.runs[key]; if (!r) return; const book = late ? s.late : s.days; if (!book[k] && !(late && s.days[k])) { book[k] = { s: r.res, ids: r.ids }; first = true; } delete s.runs[key]; });
  return first;
}

// ---- 上級：今日の一句 ----
function startHard(k) {
  save((s) => { const r = s.runs.h; if (!r || r.date !== k) s.runs.h = { date: k, id: H.hard(k), res: [] }; });
  hardStep(k);
}
function hardStep(k) {
  const s = load(), r = s.runs.h; if (!r || r.date !== k) return home();
  const hk = H.HAIKU[r.id], i = r.res.length;
  if (i >= 3) return result("h", k, commitHard(k));
  const L = hk.lines[i];
  wordScreen({ title: "上級：今日の一句", sub: `${hk.by}`, word: L.w, reading: L.r, mora: L.m, lineNo: `${["上の五", "中の七", "下の五"][i]}（${i + 1}/3）`, dots: dotsHtml(3, i),
    after: (res) => {
      save((s2) => { const r2 = s2.runs.h; if (r2 && r2.date === k && r2.res.length === i) r2.res.push(res.stars); });
      if (i < 2) nextBtn("つぎの行", () => hardStep(k));
      else { const first = commitHard(k); nextBtn("結果を見る", () => result("h", k, first)); }
    } });
}

function commitHard(k) {
  let first = false;
  save((s2) => { const r = s2.runs.h; if (!r || r.date !== k || r.res.length < 3) return; if (!s2.hdays[k]) { s2.hdays[k] = { s: r.res, id: r.id }; first = true; } if (r.res.every((x) => x > 0)) keepBest(s2.haiku, r.id, Math.min(...r.res)); delete s2.runs.h; });
  return first;
}

// ---- とことん ----
function startEndless() {
  save((s) => { if (!s.runs.e) s.runs.e = { list: H.endless(), i: 0, streak: 0, best: 0, miss: 0, n: 0 }; });
  endlessStep();
}
function endlessStep() {
  const s = load(), r = s.runs.e; if (!r) return home();
  if (r.i >= r.list.length) save((s2) => { const e = s2.runs.e; const prev = e.list[e.list.length - 1]; e.list = H.endless(Math.random, prev); e.i = 0; });
  const r2 = load().runs.e, w = H.WORDS[r2.list[r2.i]];
  wordScreen({ title: "とことん", sub: `続けて ${r2.streak}語・ベスト ${Math.max(s.ebest, r2.best)}語・まちがい ${r2.miss}`, word: w.w, reading: w.r, mora: w.m,
    extraTop: `<button class="sub" id="quit">ここで降りる</button>`,
    after: (res) => {
      save((s3) => { const e = s3.runs.e; if (!e || e.i !== r2.i || e.list[e.i] !== w.id) return; e.i++; e.n++; if (res.ok) { e.streak++; e.best = Math.max(e.best, e.streak); keepBest(s3.words, w.id, res.stars); } else { e.streak = 0; e.miss++; } s3.ebest = Math.max(s3.ebest, e.best); });
      nextBtn("つぎのことば", endlessStep);
    } });
  $("quit").onclick = endEndless;
}
function endEndless() {
  const r = load().runs.e; save((s) => { delete s.runs.e; });
  const s = load(), na = newAch();
  show(`${hdr("とことん")}
    <div class="stats"><div><b>${r ? r.n : 0}</b><small>打ったことば</small></div><div><b>${r ? r.best : 0}</b><small>続けて打てた</small></div><div><b>${s.ebest}</b><small>ベスト</small></div></div>
    ${na.map((a) => `<p class="achnew">${a.ic} 実績「${esc(a.nm)}」</p>`).join("")}
    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-book">拍帳を見る</button><button class="sub" id="back2">ホーム</button></div>${footer()}`, { "go-e": startEndless, "go-book": book, back2: home });
  say(`とことんを終えました。続けて${r ? r.best : 0}語。`);
}

// ---- 練習（記録は増やさない）----
function practice(id) {

    after: () => { nextBtn("つぎのことば", () => practice(), `<button class="sub" id="again">もう一度</button>`); $("again").onclick = () => practice(w.id); } });

// ---- 結果 ----

  const na = newAch();
  const text = mode === "h" ? `拍うち 上級 第${dayNo(k)}回 ${md(k)}\n${rec.s.map(sym).join("")} ★${total}/${max}` : `拍うち 第${dayNo(k)}回 ${md(k)}\n${rec.s.map(sym).join("")} ★${total}/${max}`;
  const withUrl = text + "\n#拍うち " + URL0;
  const showKofi = first && !late && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  const items = mode === "h" ? (() => { const hk = H.HAIKU[rec.id]; return `<div class="haiku">${hk.lines.map((L, i) => `${sym(rec.s[i])} ${esc(L.w)}`).join("<br>")}<br><small>${esc(hk.by)}</small></div>`; })()
    : `<div class="rlist">${rec.ids.map((id, i) => { const w = H.WORDS[id]; return `<div><span aria-hidden="true">${sym(rec.s[i])}</span><span class="w"><b>${esc(w.w)}</b>${esc(w.m.join("・"))}（${w.m.length}拍）</span>${stars(rec.s[i])}</div>`; }).join("")}</div>`;
  show(`${hdr(mode === "h" ? "上級：今日の一句" : late ? `あとから ${md(k)}` : "今日の5語", `第${dayNo(k)}回 ${md(k)}`)}
    <p class="calib">★ ${total} / ${max}</p>
    ${items}
    ${na.map((a) => `<p class="achnew">${a.ic} 実績「${esc(a.nm)}」</p>`).join("")}
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（今日の記録には数えません）。</p>` : `<div class="share">${esc(text)}</div><div class="shares"><button id="share">結果をシェア</button><a id="toX" target="_blank" rel="noopener">X に投稿</a></div>`}
    <button class="main alt" id="go-e">続けて遊ぶ：とことん</button>
    ${mode === "d" && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：今日の一句に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-book">拍帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    ${footer()}`, { "go-e": startEndless, "go-h": () => startHard(k), "go-p": practice, "go-book": book });
  if ($("toX")) { $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl); $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); }; }
  say(`結果。星${total}つ、${max}のうち。`);
}
function copy(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); }

// ---- 拍帳 ----
function book(kind) {

      <div class="wlist">${ws.length ? ws.map((w) => `<span>${esc(w.w)}：${esc(w.m.join("・"))}</span>`).join("") : "<p class=\"note\">まだありません。</p>"}</div>

    <div class="book">${H.KINDS.map((K) => { const all = H.WORDS.filter((w) => w.k.includes(K.id)), n = all.filter((w) => got.has(w.id)).length; return `<button data-kind="${K.id}"><span class="mk" aria-hidden="true">${K.mk}</span><span>${esc(K.name)}<small>${esc(K.tip)}</small></span><span class="ct">${n}/${all.length}</span></button>`; }).join("")}</div>

    ${footer()}`);

// ---- 実績 ----
function achView() {
  const s = load(), t = tally(s);
  show(`${hdr("実績", `${achGot(s)}/${ACH.length}`)}<div class="alist">${ACH.map(([id, ic, nm, cd, f]) => { const [a, b] = f(t), ok = a >= b; return `<div class="ach${ok ? " got" : ""}"><span class="ic" aria-hidden="true">${ok ? ic : "🔒"}</span><b>${ok ? "✓ " : ""}${esc(nm)}</b><span class="pg">${Math.min(a, b)}/${b}</span><small>${esc(cd)}</small><span class="bar"><i style="width:${Math.min(100, (a / b) * 100)}%"></i></span></div>`; }).join("")}</div>${footer()}`);

// ---- カレンダー ----
function cal(ym) {
  const s = load(), k = todayKey(), late = new Set(lateDays(s));
  const first = new Date(ym + "-01T00:00:00Z"), dow = first.getUTCDay(), days = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  const prev = addDay(ym + "-01", -1).slice(0, 7), next = addDay(ym + "-" + String(days).padStart(2, "0"), 1).slice(0, 7);
  const cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= days; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, p = s.days[key], l = s.late[key], h = s.hdays[key];
    const cls = p ? "p" : l ? "late" : late.has(key) ? "miss" : "";
    const lab = p ? `★${p.s.reduce((a, b) => a + b, 0)}` : l ? "↺" : late.has(key) ? "あとから" : "";
    cells.push(late.has(key) ? `<button class="c miss${key === k ? " today" : ""}" data-late="${key}" aria-label="${d}日 あとから遊ぶ">${d}<i>${lab}</i></button>` : `<span class="c ${cls}${key === k ? " today" : ""}">${d}<i>${lab}${h ? " 句" : ""}</i></span>`);
  }
  const t = tally(s);
  show(`${hdr("カレンダー", t.days ? `遊んだ日 合わせて${t.days}日` : "")}
    <div class="calnav"><button class="sub" id="pv" aria-label="前の月"${prev < EPOCH.slice(0, 7) ? " disabled" : ""}>◀</button><b>${+ym.slice(0, 4)}年${+ym.slice(5)}月</b><button class="sub" id="nx" aria-label="次の月"${next > k.slice(0, 7) ? " disabled" : ""}>▶</button></div>
    <div class="cal">${"日月火水木金土".split("").map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span>★数＝今日の5語</span><span>↺＝あとから</span><span>句＝上級</span><span>あとから＝押すと遊べる（${LATE}日前まで）</span></div>
    ${footer()}`, { pv: () => cal(prev), nx: () => cal(next) });
  app.querySelectorAll("[data-late]").forEach((b) => (b.onclick = () => startDaily(b.dataset.late, true)));
}

// ---- ずれを合わせる ----
function calib() {
  const s = load();
  show(`${hdr("ずれを合わせる")}
    <p class="lead">「3・2・1・はい」のあと、音が8回鳴ります。<br>音に合わせて8回押してください。</p>
    <p class="calib" id="cv">いま ${Math.round(s.opt.off * 1000)}ミリ秒</p>
    <p class="count" id="count" aria-hidden="true"></p>
    <div class="slots" id="slots" aria-label="8拍">${slotsHtml(8, Array(8).fill("拍"), false)}</div>
    <button class="pad" id="pad">はじめる<small>押すと「3・2・1・はい」</small></button>
    <div class="row"><button class="sub" id="m10">−10ミリ秒</button><button class="sub" id="p10">＋10ミリ秒</button></div>
    <p class="note">打つたびに「遅い」と出るなら＋、「早い」なら−。0にもどすときは何回か押して合わせます。</p>`, {
    m10: () => { save((s2) => { s2.opt.off = Math.max(-0.3, Math.round((s2.opt.off - 0.01) * 1000) / 1000); }); $("cv").textContent = `いま ${Math.round(load().opt.off * 1000)}ミリ秒`; },
    p10: () => { save((s2) => { s2.opt.off = Math.min(0.3, Math.round((s2.opt.off + 0.01) * 1000) / 1000); }); $("cv").textContent = `いま ${Math.round(load().opt.off * 1000)}ミリ秒`; },
  });
  const pad = $("pad"); let started = false;
  const start = () => {
    if (started) return; started = true; ac(); pad.innerHTML = "タン<small>音に合わせて</small>";
    const run = HK.auto ? Promise.resolve(HK.auto(Array.from({ length: 8 }, (_, i) => i * (60 / load().opt.bpm)), 8)).then((taps) => ({ taps, beats: Array.from({ length: 8 }, (_, i) => i * (60 / load().opt.bpm)) }))
      : playBar(Array(8).fill("拍")).then(() => (HK.last ? { taps: HK.last.raw, beats: HK.last.beats } : { taps: [], beats: [0, 1, 2, 3, 4, 5, 6, 7] }));
    run.then(({ taps, beats }) => { // taps はずれを直す前の時刻（途中で ±10 を押しても測りまちがえない）
      const spb = beats[1] - beats[0], errs = [];
      for (const raw of taps) { let bi = 0; beats.forEach((b, i) => { if (Math.abs(raw - b) < Math.abs(raw - beats[bi])) bi = i; }); const e = raw - beats[bi]; if (Math.abs(e) < spb / 2) errs.push(e); }
      if (errs.length < 5) { $("cv").textContent = "押した回数が少なかったので、もう一度"; say("押した回数が少なかったので、もう一度"); started = false; pad.disabled = false; pad.innerHTML = "もう一度<small>押すと「3・2・1・はい」</small>"; return; }
      errs.sort((a, b) => a - b);
      const med = errs[Math.floor(errs.length / 2)], off = Math.max(-0.3, Math.min(0.3, Math.round(med * 1000) / 1000));
      save((s2) => { s2.opt.off = off; s2.opt.cal = true; });
      const msg = `合わせました：${Math.round(off * 1000)}ミリ秒（${off >= 0 ? "音より遅く押しがち" : "音より早く押しがち"}だったぶんを直します）`;
      $("cv").textContent = msg; say(msg);
      started = false; pad.disabled = false; pad.innerHTML = "もう一度<small>押すと「3・2・1・はい」</small>";
      const na = newAch(); if (na.length) toast(`${na[0].ic} 実績「${na[0].nm}」`);
    });
  };
  pad.addEventListener("pointerdown", (e) => { e.preventDefault(); if (!started) { LASTIN = performance.now(); start(); } else onTap(e.timeStamp); });
  pad.addEventListener("click", (e) => { if (!started) return start(); if (performance.now() - LASTIN > 400) onTap(e.timeStamp); });
}
